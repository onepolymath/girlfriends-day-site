<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120810">
<title>For Her · 02 · The Letter</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://api.fontshare.com/v2/css?f[]=zodiak@400,401,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="config.js"></script>
<style>
  /* folded paper, sealed with wax, tap to unfold */
  .fold {
    width: clamp(280px, 84vw, 430px);
    cursor: pointer;
    transform-style: preserve-3d;
    margin-top: 26px;
  }
  .fold-paper {
    position: relative;
    background: linear-gradient(178deg, #FBF4EA 55%, #F0E2D2);
    border-radius: 8px;
    aspect-ratio: 4 / 2.9;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255,255,255,0.8);
    transform-style: preserve-3d;
  }
  .fold-paper::before, .fold-paper::after {
    content: "";
    position: absolute;
    left: 7%;
    right: 7%;
    height: 1px;
    background: rgba(70, 32, 47, 0.12);
  }
  .fold-paper::before { top: 33%; }
  .fold-paper::after  { top: 66%; }
  .fold-address {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 9%;
    font-family: var(--serif);
    font-style: italic;
    color: var(--paper-ink);
    font-size: 17px;
    opacity: 0.85;
  }
  .fold-address small {
    font-family: var(--sans);
    font-style: normal;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-top: 5px;
  }
  .fold-flap {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 34%;
    background: linear-gradient(180deg, #F4EADB, #EFE0CE);
    border-radius: 8px 8px 0 0;
    transform-origin: bottom center;
    transition: transform 0.9s cubic-bezier(0.6, 0, 0.2, 1);
    box-shadow: 0 -1px 0 rgba(255,255,255,0.7) inset;
    z-index: 2;
  }
  .seal-btn {
    position: absolute;
    left: 50%;
    top: 34%;
    translate: -50% -50%;
    width: 62px;
    height: 62px;
    border: none;
    background: none;
    cursor: pointer;
    z-index: 3;
    transition: opacity 0.4s, scale 0.4s;
    filter: drop-shadow(0 5px 14px rgba(0,0,0,0.35));
  }
  .fold.open .fold-flap { transform: rotateX(-165deg); }
  .fold.open .seal-btn { opacity: 0; scale: 0.35; pointer-events: none; }
  .fold.open { animation: foldAway 0.7s ease 0.75s both; }
  @keyframes foldAway {
    to { opacity: 0; transform: translateY(40px) rotateX(28deg) scale(0.9); visibility: hidden; }
  }
  .tap-hint { margin-top: 22px; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink-faint); }

  /* the opened letter */
  .letter-view {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 96px var(--pad) 140px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(36px) rotateX(14deg);
    transition: opacity 0.9s ease 1.15s, transform 0.9s ease 1.15s;
  }
  body.letter-open .letter-view { opacity: 1; pointer-events: auto; transform: none; }
  body.letter-open .fold-wrap { pointer-events: none; }
  .letter-card {
    background: linear-gradient(178deg, #FDF8F0, #F4E8D8);
    color: var(--paper-ink);
    max-width: clamp(480px, 46vw, 660px);
    width: 100%;
    max-height: calc(100dvh - 220px);
    overflow-y: auto;
    border-radius: 14px;
    padding: clamp(38px, 3vw + 26px, 58px) clamp(32px, 2.8vw + 21px, 52px) clamp(30px, 2vw + 22px, 44px);
    text-align: left;
    box-shadow: 0 36px 90px rgba(0, 0, 0, 0.6);
  }
  .letter-card .salutation {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(30px, 1.6vw + 24px, 42px);
    margin-bottom: 20px;
    color: #8a2c4e;
  }
  .letter-card p {
    font-size: clamp(15.5px, 0.5vw + 13.6px, 18.5px);
    line-height: 1.75;
    margin-bottom: clamp(15px, 0.8vw + 12px, 22px);
  }
  .letter-card p:first-of-type::first-letter {
    font-family: var(--serif);
    font-size: 52px;
    float: left;
    line-height: 0.78;
    margin: 3px 9px 0 0;
    color: #8a2c4e;
  }
  .letter-card .sig {
    font-family: var(--serif);
    font-style: italic;
    font-size: 24px;
    text-align: right;
    color: #8a2c4e;
    margin-top: 24px;
  }
  .letter-card .sig small {
    display: block;
    font-family: var(--sans);
    font-style: normal;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.5;
    margin-top: 6px;
  }
</style>
</head>
<body data-page="letter" data-idx="2" data-next="gallery.html" data-next-title="The Gallery" data-next-bg="https://images.unsplash.com/photo-1519677100203-a0e668c92439?w=1600&q=80">
<div class="backdrop" style="background-image:url('https://images.unsplash.com/photo-1487035242901-d419a42d17af?w=1600&q=80')"></div>

<main class="page">
  <div class="stage fold-wrap">
    <div class="eyebrow">Page Two</div>
    <h1 class="h2">Something I wrote you</h1>
    <div class="fold tilt" id="fold">
      <div class="fold-paper">
        <div class="fold-flap"></div>
        <button class="seal-btn" aria-label="Break the seal">
          <svg viewBox="0 0 74 74" width="62" height="62">
            <defs>
              <radialGradient id="wax2" cx="38%" cy="30%">
                <stop offset="0%" stop-color="#F6DDAE"/>
                <stop offset="55%" stop-color="#E3B26B"/>
                <stop offset="100%" stop-color="#B9853C"/>
              </radialGradient>
            </defs>
            <circle cx="37" cy="37" r="34" fill="url(#wax2)"/>
            <circle cx="37" cy="37" r="28.5" fill="none" stroke="#8a6127" stroke-width="0.8" opacity="0.55"/>
            <path d="M37 48c-7-5.5-12-9.5-12-15a6.4 6.4 0 0 1 12-3 6.4 6.4 0 0 1 12 3c0 5.5-5 9.5-12 15z" fill="#5d3d14"/>
          </svg>
        </button>
        <div class="fold-address">
          <span id="addr-name"></span>
          <small>break the seal</small>
        </div>
      </div>
    </div>
    <div class="tap-hint">tap the wax seal</div>
  </div>

  <section class="letter-view">
    <article class="letter-card" id="letter-card"></article>
  </section>
</main>

<script src="shared.js"></script>
<script>
  document.getElementById("addr-name").textContent = "to " + GFD.herName;
  document.getElementById("letter-card").innerHTML =
    `<div class="salutation">My love,</div>` +
    GFD.letter.map(p => `<p>${p}</p>`).join("") +
    `<div class="sig">${GFD.yourName}<small>written for girlfriend's day</small></div>`;

  const fold = document.getElementById("fold");
  fold.addEventListener("click", () => {
    if (fold.classList.contains("open")) return;
    fold.classList.add("open");
    document.body.classList.add("letter-open");
    const d = document.documentElement;
    gfdBurst(d.clientWidth / 2, d.clientHeight / 2.4, 20);
  }, { once: false });
</script>
</body>
</html>
