<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120810">
<title>For Her · 04 · The Reasons</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://api.fontshare.com/v2/css?f[]=zodiak@400,401,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="config.js"></script>
<style>
  .deck {
    width: clamp(340px, 88vw, 520px);
    height: clamp(300px, 12vw + 254px, 380px);
    perspective: 1000px;
    margin: clamp(36px, 2.6vw + 26px, 56px) 0 clamp(18px, 1.4vw + 12px, 30px);
    cursor: pointer;
    position: relative;
  }
  .reason {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: linear-gradient(165deg, rgba(255, 246, 239, 0.09), rgba(255, 246, 239, 0.03));
    border: 1px solid var(--hairline);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.45);
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: left;
    padding: clamp(34px, 2.6vw + 24px, 52px) clamp(32px, 2.4vw + 23px, 48px);
    transform-style: preserve-3d;
    transition: transform 0.65s cubic-bezier(0.5, 0, 0.28, 1), opacity 0.65s;
  }
  .reason .num {
    font-family: var(--serif);
    font-size: clamp(52px, 2.6vw + 42px, 72px);
    line-height: 1;
    color: var(--gold);
    opacity: 0.9;
  }
  .reason .num small {
    font-size: 18px;
    color: var(--ink-faint);
    font-family: var(--sans);
    letter-spacing: 0.1em;
  }
  .reason h2 {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(28px, 1.5vw + 22px, 40px);
    margin: 12px 0 10px;
  }
  .reason p {
    font-size: clamp(14.5px, 0.55vw + 12.4px, 18px);
    line-height: 1.65;
    color: var(--ink-dim);
  }
  .reason.exit  { transform: translateX(-115%) rotateY(-42deg); opacity: 0; }
  .reason.enter { transform: translateX(115%) rotateY(42deg); opacity: 0; }
  .tap-hint { font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink-faint); }
</style>
</head>
<body data-page="reasons" data-idx="4" data-next="us.html" data-next-title="The Time" data-next-bg="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1600&q=80">
<div class="backdrop" style="background-image:url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=1600&q=80')"></div>

<main class="page">
  <div class="stage">
    <div class="eyebrow">Page Four</div>
    <h1 class="h2">Reasons I love you</h1>
    <div class="deck tilt" id="deck"></div>
    <div class="tap-hint">tap the card for the next one</div>
  </div>
</main>

<script src="shared.js"></script>
<script>
(() => {
  const R = GFD.reasons;
  const deck = document.getElementById("deck");
  let i = 0, busy = false;

  const card = (k, cls = "") => {
    const el = document.createElement("div");
    el.className = "reason " + cls;
    el.innerHTML = `
      <div class="num">${String(k + 1).padStart(2, "0")}<small> / ${String(R.length).padStart(2, "0")}</small></div>
      <h2>${R[k].title}</h2>
      <p>${R[k].body}</p>`;
    return el;
  };
  deck.appendChild(card(0));

  deck.addEventListener("click", () => {
    if (busy) return;
    busy = true;
    const old = deck.querySelector(".reason:not(.enter)");
    old.classList.add("exit");
    i = (i + 1) % R.length;
    const next = card(i, "enter");
    deck.appendChild(next);
    requestAnimationFrame(() => requestAnimationFrame(() => next.classList.remove("enter")));
    setTimeout(() => { old.remove(); busy = false; }, 680);
  });
})();
</script>
</body>
</html>
