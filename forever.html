<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120810">
<title>For Her · 06 · Forever</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://api.fontshare.com/v2/css?f[]=zodiak@400,401,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="config.js"></script>
<style>
  .press {
    width: clamp(108px, 8vw + 78px, 156px);
    height: clamp(108px, 8vw + 78px, 156px);
    border: none;
    background: none;
    cursor: pointer;
    margin: clamp(40px, 2.8vw + 29px, 62px) 0 6px;
    filter: drop-shadow(0 10px 30px rgba(232, 85, 125, 0.45));
    transition: transform 0.15s ease;
    animation: pressPulse 2.2s ease-in-out infinite;
  }
  .press:active { transform: scale(0.92); }
  @keyframes pressPulse {
    0%, 100% { filter: drop-shadow(0 10px 30px rgba(232, 85, 125, 0.45)); }
    50%      { filter: drop-shadow(0 10px 44px rgba(232, 85, 125, 0.8)); }
  }
  .press-hint { font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink-faint); }
  .final {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(28px, 7.5vw, 46px);
    line-height: 1.2;
    max-width: 560px;
    margin-top: 34px;
    color: var(--gold-soft);
    text-shadow: 0 6px 40px rgba(232, 85, 125, 0.5);
    opacity: 0;
    transform: translateY(22px);
    transition: opacity 1s ease, transform 1s ease;
  }
  .final.show { opacity: 1; transform: none; }
  .replay {
    margin-top: 30px;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink-dim);
    text-decoration: none;
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 4px;
    opacity: 0;
    transition: opacity 0.8s ease 0.6s;
  }
  .replay.show { opacity: 1; }
</style>
</head>
<body data-page="forever" data-idx="6">
<div class="backdrop" style="background-image:url('https://images.unsplash.com/photo-1531306728370-e2ebd9d7bb99?w=1600&q=80')"></div>

<main class="page">
  <div class="stage">
    <div class="eyebrow">The Last Page</div>
    <h1 class="h2" id="finale-title">Press the heart</h1>
    <button class="press" id="press" aria-label="Press the heart">
      <svg viewBox="0 0 108 108" width="100%" height="100%">
        <defs>
          <radialGradient id="hg" cx="36%" cy="26%">
            <stop offset="0%" stop-color="#FF9AB5"/>
            <stop offset="55%" stop-color="#E8557D"/>
            <stop offset="100%" stop-color="#B22D55"/>
          </radialGradient>
          <radialGradient id="gloss" cx="50%" cy="50%">
            <stop offset="0%" stop-color="#fff" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <path d="M54 92C33 76 18 63.5 18 46.5A19 19 0 0 1 54 38a19 19 0 0 1 36 8.5C90 63.5 75 76 54 92z" fill="url(#hg)"/>
        <ellipse cx="40" cy="46" rx="15" ry="11" fill="url(#gloss)" transform="rotate(-24 40 46)"/>
      </svg>
    </button>
    <div class="press-hint">go on, press it</div>
    <div class="final" id="final"></div>
    <a class="replay" id="replay" href="index.html">read it again from the cover</a>
  </div>
</main>

<script src="shared.js"></script>
<script>
(() => {
  const final = document.getElementById("final");
  final.textContent = GFD.finalMessage;
  const title = document.getElementById("finale-title");
  let taps = 0;
  document.getElementById("press").addEventListener("click", e => {
    const d = document.documentElement;
    gfdBurst(e.clientX || d.clientWidth / 2, e.clientY || d.clientHeight / 2, 30);
    taps++;
    final.classList.add("show");
    document.getElementById("replay").classList.add("show");
    if (taps === 3) title.textContent = "Okay, one more";
    if (taps === 5) title.textContent = "You really like this button";
  });
})();
</script>
</body>
</html>
